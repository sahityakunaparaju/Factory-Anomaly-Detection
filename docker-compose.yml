version: '3.9'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.14
    container_name: factory-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
      - --set
      - redpanda.enable_transactions=true
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
